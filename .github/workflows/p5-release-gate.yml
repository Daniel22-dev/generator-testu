name: P5 R2 pre-production release gate

on:
  workflow_dispatch:
  push:
    branches: [pre-server-forms-workflow, candidate, main]

permissions:
  contents: read

concurrency:
  group: generator-p5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p5-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure shared CI Node setup
        uses: ./.github/actions/setup-ci-node
      - name: Install independently verified CI tools
        id: ci_tools
        timeout-minutes: 12
        uses: ./.github/actions/install-ci-tools
        with:
          expected-sha: ${{ github.sha }}
          browser-env: CHROMIUM_PATH

      - name: Preserve per-job toolchain provenance
        if: always() && (steps.ci_tools.outcome == 'success' || steps.ci_tools.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generator-toolchain-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/generator-ci-tools/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/toolchain.json
          retention-days: 14
          if-no-files-found: error
      - name: Verify pinned audit tools
        run: |
          node -e "const p=require('./node_modules/axe-core/package.json'); if(p.version!=='4.12.1') process.exit(1)"
          node -e "const p=require('./node_modules/playwright/package.json'); if(p.version!=='1.61.1') process.exit(1)"
      - name: Run E9 regression, foundation and final P5 admission
        run: npm run qa:redteam:ci
        env:
          GARP27_EXTERNAL_TRUST_SHA256: c228a89d1d162e859dc92c9befeb9b4833255848c94a9eca575f793689ff917f
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p5-r2-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/qa-p5-*.json
            dist/qa-p3-browser-report.json
            dist/quality-report.json
            qa-results/d7-regressions.json
            qa-results/d8-final-audit.json
            qa-results/recovery-browser-s1.json
            qa-results/pedagogical-fidelity-browser-s2.json
            qa-results/workflow-fidelity-browser-s3.json
            qa-results/s4-teacher-verifier-source.json
            qa-results/s41-teacher-verifier-remediation.json
            qa-results/s4-teacher-verifier-browser/evidence.json
            qa-results/s4-teacher-verifier-browser/*.png
            qa-results/s5-strict-mode-source.json
            qa-results/s5-strict-mode-browser/evidence.json
            qa-results/s5-traceability-t64-t101.json
            qa-results/s5-ci-wiring.json
            qa-results/s6-pedagogical-ai-source.json
            qa-results/s6-pedagogical-ai-browser/evidence.json
            qa-results/s6-traceability-t12-t42-t54-t63.json
            qa-results/s6-ci-wiring.json
            qa-results/s61-identity-quarantine-source.json
            qa-results/s61-identity-quarantine-browser/evidence.json
            qa-results/s61-identity-quarantine-browser/*.png
            qa-results/s61-ci-wiring.json
            qa-results/redteam-e*.json
            qa-results/security-behavior-r3.json
            qa-results/adversarial-harness-r5.json
            qa-results/redteam-e7-mobile-protocol.json
            qa-results/redteam-e7-recorder.json
            qa-results/redteam-e8-forgery.json
            qa-results/redteam-e8-retention.json
            qa-results/redteam-e8-browser.json
            qa-results/stage3-pdf-runtime/summary.json
            qa-results/stage3-pdf-quality/summary.json
            qa-results/verifier-ui-runtime/summary.json
            qa-results/redteam-e9-*.json
            qa-results/redteam-e9-negative/*.log
            qa-results/redteam-e10-ci/*.log
            qa-results/redteam-e10-ci/foundation-evidence/
            audit/evidence/garp27-current/
