name: Refresh 7.1.62 release evidence

on:
  push:
    branches: [audit/stage-b-teacher-verifier-2-2026-10-01]

permissions:
  contents: write

concurrency:
  group: refresh-7162-evidence
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Regenerate deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run garp25:sbom
          npm run garp25:ai-evidence
          find security -type f ! -path 'security/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > security/SHA256SUMS.txt
          npm run check:versions
          npm run garp25:sbom:check
          npm run garp25:ai-evidence:check
      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security/evidence/ai-assurance-fingerprint.json security/sbom/generator-testu-7.1.62.cdx.json security/SHA256SUMS.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(release): refresh 7.1.62 security evidence"
          git push origin HEAD:audit/stage-b-teacher-verifier-2-2026-10-01
