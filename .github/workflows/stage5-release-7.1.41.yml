name: Stage 5 - prepare Generator 7.1.41 E2E patch

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generator-stage5-release-7-1-41-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Detect Stage 5 release state
        id: release_state
        shell: bash
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "7.1.40" ]; then
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT" = "7.1.41" ]; then
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Stage 5 expects Generator 7.1.40 or already-prepared 7.1.41, found $CURRENT"
            exit 1
          fi

      - name: Prepare deterministic 7.1.41 patch in workspace
        if: steps.release_state.outputs.needs_bump == 'true'
        run: node scripts/stage5-release-7.1.41.mjs

      - name: Verify AI Studio dispatch credential before release
        if: steps.release_state.outputs.needs_bump == 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          AI_STUDIO_DISPATCH_TOKEN: ${{ secrets.AI_STUDIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$AI_STUDIO_DISPATCH_TOKEN" ]; then
            echo "::error::Missing AI_STUDIO_DISPATCH_TOKEN. Stage 5 will not create 7.1.41 until automatic Studio notification is available."
            exit 1
          fi
          echo "AI Studio dispatch credential is available."

      - name: Install locked dependencies
        if: steps.release_state.outputs.needs_bump == 'true'
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Install pinned Playwright Chromium
        if: steps.release_state.outputs.needs_bump == 'true'
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Verify generated release diff is syntactically clean
        if: steps.release_state.outputs.needs_bump == 'true'
        run: git diff --check

      - name: Run full P5 R2 against generated 7.1.41
        if: steps.release_state.outputs.needs_bump == 'true'
        run: npm run qa:p5:ci

      - name: Commit verified 7.1.41 release to main
        if: steps.release_state.outputs.needs_bump == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            APP-generator-GARP.txt \
            CHANGELOG.md \
            README.md \
            RELEASE-NOTES-7.1.41.md \
            ghrab-platform.consumer.json \
            package.json \
            package-lock.json \
            public/access/error-reporter-adapter.js \
            public/ai-operations.json \
            public/config/data-manifest.json \
            public/config/platform-manifest.json \
            public/config/release-acceptance.json \
            public/config/security-headers.json \
            public/ghrab-platform.consumer.json \
            public/manifest.webmanifest \
            public/manual/index.html \
            public/sw.js \
            qa/qa-manifest.json \
            reporter-test.config.json \
            scripts/test-suite-session-lifecycle.mjs \
            security/ASSURANCE-STATUS.txt \
            security/NEGATIVE-CONTROLS.txt \
            security/SECRET-SCAN-SUMMARY.txt \
            security/SHA256SUMS.txt \
            security/evidence/ai-assurance-fingerprint.json \
            security/evidence/autopatch-e2e-7.1.41-2026-09-16/scope.txt \
            security/garp25/TOOLING-SOURCE.txt \
            security/sbom/generator-testu-7.1.41.cdx.json \
            src/js/01-core.js \
            src/js/07z-ai-core-integration.js \
            src/shell.html
          git diff --cached --check
          git commit -m "release: Generator 7.1.41 auto-patch E2E candidate"
          git push origin HEAD:main

      - name: Already prepared
        if: steps.release_state.outputs.needs_bump == 'false'
        run: echo "Generator 7.1.41 is already prepared; no Stage 5 bump action required."
