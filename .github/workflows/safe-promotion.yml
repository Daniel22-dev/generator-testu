name: Safe Promotion - candidate to main

on:
  push:
    branches: [candidate]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: prepare-promotion
    if: github.ref == 'refs/heads/candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: generator-prepare-validation-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    outputs:
      certified_sha: ${{ steps.source.outputs.sha }}
      main_sha: ${{ steps.source.outputs.main_sha }}
      pr_number: ${{ steps.pr.outputs.number }}
      eligible: ${{ steps.ready.outputs.eligible }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Require native main protection before early PR creation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/main-protection.mjs --live

      - name: Pin fresh candidate and main before preparing PR
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ github.sha }}
        run: node scripts/ci/promotion-freshness.mjs --prepare

      - name: Create or reuse protected candidate pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_candidate="$(git ls-remote origin refs/heads/candidate | awk '{print $1}')"
          test "$current_candidate" = "$CERTIFIED_SHA"
          prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --head candidate --base main --state open --json number)"
          count="$(jq 'length' <<<"$prs")"
          test "$count" -le 1
          pr_number="$(jq -r '.[0].number // empty' <<<"$prs")"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --head candidate --base main --title 'Promote verified Generator candidate' --body 'P1: two independent full certifications run on separate runners for the same exact SHA. Native release-admission, candidate, PR, P5 and Journey checks are required before merge. Creation of this PR is not approval for merge.')"
            pr_number="${pr_url##*/}"
          fi
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Bind protected PR to prepared candidate and main
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ github.sha }}
          PREPARED_MAIN_SHA: ${{ steps.source.outputs.main_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: node scripts/ci/promotion-freshness.mjs --pr

  candidate-gate:
    name: candidate-gate
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: generator-candidate-validation-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      certified_sha: ${{ needs.prepare.outputs.certified_sha }}
      eligible: ${{ steps.freshness.outputs.eligible }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.certified_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure shared CI Node setup
        uses: ./.github/actions/setup-ci-node

      - name: Verify exact PR candidate and prepared main
        id: initial_freshness
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ needs.prepare.outputs.certified_sha }}
          PREPARED_MAIN_SHA: ${{ needs.prepare.outputs.main_sha }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        run: node scripts/ci/promotion-freshness.mjs --pr

      - name: Install independently verified CI tools
        id: ci_tools
        timeout-minutes: 12
        uses: ./.github/actions/install-ci-tools
        with:
          expected-sha: ${{ needs.prepare.outputs.certified_sha }}
          browser-env: CHROMIUM_PATH

      - name: Preserve per-job toolchain provenance
        if: always() && (steps.ci_tools.outcome == 'success' || steps.ci_tools.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generator-toolchain-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/generator-ci-tools/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/toolchain.json
          retention-days: 14
          if-no-files-found: error


      - name: Run unified error reporter regression
        run: npm run test:reporter

      - name: Record structured QA start
        id: release_start
        shell: bash
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Run GHRAB QA release gate
        id: release_qa
        run: npm run qa:release
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Validate current structured QA evidence
        id: release_evidence
        if: always() && (steps.release_qa.outcome == 'success' || steps.release_qa.outcome == 'failure')
        env:
          CI_RELEASE_STARTED_AT: ${{ steps.release_start.outputs.started_at }}
          CI_RELEASE_OUTCOME: ${{ steps.release_qa.outcome }}
        run: node scripts/ci/release-evidence.mjs

      - name: Preserve structured QA before destructive red-team cleanup
        if: always() && steps.release_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generator-candidate-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            qa-results/qa-report.json
            qa-results/qa-report.html
            qa-results/release-verdict.txt
            qa-results/qa-test-matrix.csv
            qa-results/qa-release-evidence.json

      - name: Verify GHRAB Platform P3 conformance
        run: npm run qa:platform

      - name: Enforce P5 R2 release gate including GARP 2.7 and legacy GARP 2.5.1/N5
        run: npm run qa:redteam:ci
        env:
          GARP27_EXTERNAL_TRUST_SHA256: 831b87232ff4c3b9e517c25728153e97b3489d18f859bb235a7e3e9a06c9a896

      - name: Upload candidate QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generator-candidate-qa-${{ github.sha }}
          path: qa-results

      - name: Verify exact PR candidate and prepared main
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ needs.prepare.outputs.certified_sha }}
          PREPARED_MAIN_SHA: ${{ needs.prepare.outputs.main_sha }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        run: node scripts/ci/promotion-freshness.mjs --pr

  pr-certification:
    name: pr-certification
    concurrency:
      group: generator-pr-validation-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 60
    # Certification only reads the exact PR/SHA and repository contents; it does not mutate either.
    permissions:
      contents: read
      pull-requests: read
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    outputs:
      certified_sha: ${{ needs.prepare.outputs.certified_sha }}
      eligible: ${{ steps.final_freshness.outputs.eligible }}
    steps:
      - name: Checkout exact certified PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.certified_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure shared CI Node setup
        uses: ./.github/actions/setup-ci-node

      - name: Verify exact PR candidate and prepared main
        id: pr_freshness
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ needs.prepare.outputs.certified_sha }}
          PREPARED_MAIN_SHA: ${{ needs.prepare.outputs.main_sha }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        run: node scripts/ci/promotion-freshness.mjs --pr

      - name: Install independently verified CI tools
        id: ci_tools
        timeout-minutes: 12
        uses: ./.github/actions/install-ci-tools
        with:
          expected-sha: ${{ needs.prepare.outputs.certified_sha }}
          browser-env: CHROMIUM_PATH

      - name: Preserve per-job toolchain provenance
        if: always() && (steps.ci_tools.outcome == 'success' || steps.ci_tools.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generator-toolchain-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/generator-ci-tools/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/toolchain.json
          retention-days: 14
          if-no-files-found: error


      - name: Run PR unified error reporter regression
        run: npm run test:reporter

      - name: Record structured QA start
        id: release_start
        shell: bash
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Run PR GHRAB QA release gate
        id: release_qa
        run: npm run qa:release
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Validate current structured QA evidence
        id: release_evidence
        if: always() && (steps.release_qa.outcome == 'success' || steps.release_qa.outcome == 'failure')
        env:
          CI_RELEASE_STARTED_AT: ${{ steps.release_start.outputs.started_at }}
          CI_RELEASE_OUTCOME: ${{ steps.release_qa.outcome }}
        run: node scripts/ci/release-evidence.mjs

      - name: Preserve structured QA before destructive red-team cleanup
        if: always() && steps.release_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generator-pr-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            qa-results/qa-report.json
            qa-results/qa-report.html
            qa-results/release-verdict.txt
            qa-results/qa-test-matrix.csv
            qa-results/qa-release-evidence.json

      - name: Verify PR GHRAB Platform P3 conformance
        run: npm run qa:platform

      - name: Enforce PR P5 R2 release gate including GARP 2.7 and legacy GARP 2.5.1/N5
        run: npm run qa:redteam:ci
        env:
          GARP27_EXTERNAL_TRUST_SHA256: 831b87232ff4c3b9e517c25728153e97b3489d18f859bb235a7e3e9a06c9a896

      - name: Upload PR certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generator-pr-certification-${{ needs.prepare.outputs.certified_sha }}
          path: qa-results

      - name: Verify exact PR candidate and prepared main
        id: final_freshness
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ needs.prepare.outputs.certified_sha }}
          PREPARED_MAIN_SHA: ${{ needs.prepare.outputs.main_sha }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        run: node scripts/ci/promotion-freshness.mjs --pr

  admission:
    name: release-admission
    # Always executes even when a dependency failed or was skipped.
    if: always()
    needs: [prepare, candidate-gate, pr-certification]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: generator-admission-validation-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    outputs:
      eligible: ${{ steps.admitted.outputs.eligible }}
      certified_sha: ${{ steps.admitted.outputs.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Reject failed skipped cancelled or foreign certification results
        env:
          CERTIFIED_SHA: ${{ github.sha }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/release-admission.mjs --prerequisites

      - name: Recheck native protection before admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/main-protection.mjs --live

      - name: Require independent P5 and Journey E2E for exact certified SHA
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ needs.prepare.outputs.certified_sha }}
        run: node scripts/ci/release-admission.mjs --independent

      - name: Require classroom release readiness
        run: node scripts/check-redteam-release-e10.mjs --require-ready

      - name: Admit only the still-current PR candidate and main
        id: admitted
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ needs.prepare.outputs.certified_sha }}
          PREPARED_MAIN_SHA: ${{ needs.prepare.outputs.main_sha }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        run: node scripts/ci/promotion-freshness.mjs --pr

      - name: Upload premerge admission evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generator-premerge-admission-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: qa-results/*-p1.json

  promote:
    name: promote-certified-pr
    concurrency:
      group: generator-promotion-transaction
      cancel-in-progress: false
    # Final promotion must read Actions status, merge the certified PR, and synchronize candidate to the resulting main SHA.
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    needs: [prepare, candidate-gate, pr-certification, admission]
    if: needs.admission.result == 'success' && needs.admission.outputs.eligible == 'true' && needs.admission.outputs.certified_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact certified SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.certified_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Recheck native protection inside the promotion lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/main-protection.mjs --live

      - name: Recheck independent gates inside the promotion lock
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ needs.prepare.outputs.certified_sha }}
        run: node scripts/ci/release-admission.mjs --independent

      - name: Require classroom release readiness
        run: node scripts/check-redteam-release-e10.mjs --require-ready

      - name: Final fail-closed freshness gate immediately before merge
        id: premerge
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ needs.prepare.outputs.certified_sha }}
          PREPARED_MAIN_SHA: ${{ needs.prepare.outputs.main_sha }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        run: node scripts/ci/promotion-freshness.mjs --pr

      - name: Merge certified pull request into main
        if: steps.premerge.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ needs.prepare.outputs.certified_sha }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$CERTIFIED_SHA"

      - name: Verify merged source is present on main
        if: steps.premerge.outputs.eligible == 'true'
        id: merged
        shell: bash
        env:
          CERTIFIED_SHA: ${{ needs.prepare.outputs.certified_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_head="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$CERTIFIED_SHA" origin/main; then
            echo "::error::Certified SHA $CERTIFIED_SHA is not contained in main $main_head after merge."
            exit 1
          fi
          echo "main_head=$main_head" >> "$GITHUB_OUTPUT"

      - name: Create P4 promotion certificate
        if: steps.premerge.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ needs.prepare.outputs.certified_sha }}
          PREPARED_MAIN_SHA: ${{ needs.prepare.outputs.main_sha }}
          MERGED_MAIN_SHA: ${{ steps.merged.outputs.main_head }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          GARP27_EXTERNAL_TRUST_SHA256: 831b87232ff4c3b9e517c25728153e97b3489d18f859bb235a7e3e9a06c9a896
        run: node scripts/ci/p4-promotion-evidence.mjs --produce

      - name: Upload P4 promotion certificate
        if: steps.premerge.outputs.eligible == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generator-p4-promotion-${{ steps.merged.outputs.main_head }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-results/p4-promotion-certificate.json
          retention-days: 14
          if-no-files-found: error

      - name: Ensure production deployment runs on merged main
        if: steps.premerge.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ needs.prepare.outputs.certified_sha }}
          MAIN_HEAD: ${{ steps.merged.outputs.main_head }}
          PROMOTION_ARTIFACT_NAME: generator-p4-promotion-${{ steps.merged.outputs.main_head }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          expected_title="P4 deploy $MAIN_HEAD from promotion $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          runs_api="repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=30"
          before_file="$RUNNER_TEMP/p4-deploy-before.txt"

          matching_runs() {
            gh api "$runs_api" \
              --jq ".workflow_runs[] | select(.head_sha == \"$MAIN_HEAD\") | select(.display_title == \"$expected_title\") | .id"
          }

          dispatch_once() {
            current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            if [ "$current_main" != "$MAIN_HEAD" ]; then
              echo "::error::Main moved before P4 deployment retry: expected $MAIN_HEAD, got $current_main."
              return 1
            fi

            matching_runs > "$before_file" || true
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f promotion_run_id="$GITHUB_RUN_ID" \
              -f promotion_run_attempt="$GITHUB_RUN_ATTEMPT" \
              -f promotion_artifact_name="$PROMOTION_ARTIFACT_NAME" \
              -f certified_sha="$CERTIFIED_SHA" \
              -f merged_main_sha="$MAIN_HEAD"

            deploy_run=""
            for wait_attempt in $(seq 1 60); do
              deploy_run="$(matching_runs | grep -vxFf "$before_file" | head -n 1 || true)"
              if [ -n "$deploy_run" ]; then
                break
              fi
              echo "Waiting for a new exact P4 deploy run for $MAIN_HEAD (attempt $wait_attempt/60)."
              sleep 3
            done

            if [ -z "$deploy_run" ]; then
              echo "::warning::A new exact P4 deployment run did not appear for main SHA $MAIN_HEAD."
              return 1
            fi

            echo "Waiting for P4 production deployment run $deploy_run on main $MAIN_HEAD."
            gh run watch "$deploy_run" --repo "$GITHUB_REPOSITORY" --exit-status
          }

          test "$(git rev-parse origin/main)" = "$MAIN_HEAD"
          deployed=0
          for deploy_attempt in 1 2 3; do
            echo "P4 production deployment attempt $deploy_attempt/3."
            if dispatch_once; then
              deployed=1
              break
            fi
            echo "::warning::P4 deployment attempt $deploy_attempt failed while the promotion certificate is still live."
            sleep 8
          done

          if [ "$deployed" -ne 1 ]; then
            echo "::error::P4 production deployment failed after 3 bounded attempts."
            exit 1
          fi

      - name: Synchronise candidate to promoted main when still safe
        if: steps.premerge.outputs.eligible == 'true'
        shell: bash
        env:
          CERTIFIED_SHA: ${{ needs.prepare.outputs.certified_sha }}
          MAIN_HEAD: ${{ steps.merged.outputs.main_head }}
        run: bash scripts/ci/sync-candidate.sh
