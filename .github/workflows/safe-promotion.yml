name: Safe Promotion - candidate to main

on:
  push:
    branches: [candidate]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generator-safe-promotion
  cancel-in-progress: false

jobs:
  candidate-gate:
    name: candidate-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout certified candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Run unified error reporter regression
        run: npm run test:reporter

      - name: Run GHRAB QA release gate
        run: npm run qa:release
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Verify GHRAB Platform P3 conformance
        run: npm run qa:platform

      - name: Enforce P5 R2 release gate including GARP 2.5 and N5
        run: npm run qa:p5:ci

      - name: Upload candidate QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generator-candidate-qa-${{ github.sha }}
          path: qa-results

      - name: Refuse stale candidate promotion
        shell: bash
        env:
          CERTIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin candidate
          current_candidate="$(git rev-parse origin/candidate)"
          if [ "$current_candidate" != "$CERTIFIED_SHA" ]; then
            echo "::error::candidate advanced during certification ($CERTIFIED_SHA -> $current_candidate); refusing stale promotion."
            exit 1
          fi

      - name: Create or reuse candidate pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_candidate="$(git ls-remote origin refs/heads/candidate | awk '{print $1}')"
          if [ "$current_candidate" != "$CERTIFIED_SHA" ]; then
            echo "::error::candidate changed before PR creation ($CERTIFIED_SHA -> $current_candidate)."
            exit 1
          fi
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head candidate --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --head candidate --base main --title 'Promote verified Generator candidate' --body 'Automated Safe Promotion. Only the exact candidate SHA certified by GARP 2.5/N5, QA, P3 and P5 R2 may be promoted.')"
            pr_number="${pr_url##*/}"
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Recheck certified SHA before merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          pr_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          current_candidate="$(git ls-remote origin refs/heads/candidate | awk '{print $1}')"
          if [ "$pr_head" != "$CERTIFIED_SHA" ] || [ "$current_candidate" != "$CERTIFIED_SHA" ]; then
            echo "::error::certified SHA is no longer the PR/candidate HEAD; refusing merge."
            exit 1
          fi

      - name: Merge verified candidate into main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge
