name: Safe Promotion - candidate to main

on:
  push:
    branches: [candidate]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: generator-safe-promotion
  cancel-in-progress: false

jobs:
  candidate-gate:
    name: candidate-gate
    if: github.ref == 'refs/heads/candidate'
    runs-on: ubuntu-latest
    outputs:
      certified_sha: ${{ steps.certified.outputs.sha }}
      fresh: ${{ steps.freshness.outputs.fresh }}
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Record exact candidate SHA
        id: certified
        shell: bash
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Run unified error reporter regression
        run: npm run test:reporter

      - name: Run GHRAB QA release gate
        run: npm run qa:release
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Verify GHRAB Platform P3 conformance
        run: npm run qa:platform

      - name: Enforce P5 R2 release gate including GARP 2.5 and N5
        run: npm run qa:p5:ci

      - name: Upload candidate QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generator-candidate-qa-${{ github.sha }}
          path: qa-results

      - name: Check candidate is still the certified SHA
        id: freshness
        shell: bash
        env:
          CERTIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin candidate
          current_candidate="$(git rev-parse origin/candidate)"
          if [ "$current_candidate" != "$CERTIFIED_SHA" ]; then
            echo "::notice::Candidate advanced during certification ($CERTIFIED_SHA -> $current_candidate). This run is superseded and will not promote anything."
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or reuse candidate pull request
        if: steps.freshness.outputs.fresh == 'true'
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_candidate="$(git ls-remote origin refs/heads/candidate | awk '{print $1}')"
          if [ "$current_candidate" != "$CERTIFIED_SHA" ]; then
            echo "::error::Candidate changed before PR creation ($CERTIFIED_SHA -> $current_candidate)."
            exit 1
          fi
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head candidate --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --head candidate --base main --title 'Promote verified Generator candidate' --body 'Automated Safe Promotion. Only the exact candidate SHA certified by GARP 2.5/N5, QA, P3 and P5 R2 may be promoted. A second independent PR-certification job must also pass before merge.')"
            pr_number="${pr_url##*/}"
          fi
          pr_head="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          if [ "$pr_head" != "$CERTIFIED_SHA" ]; then
            echo "::error::Open promotion PR #$pr_number does not point to certified SHA $CERTIFIED_SHA (head=$pr_head)."
            exit 1
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

  pr-certification:
    name: pr-certification
    needs: candidate-gate
    if: needs.candidate-gate.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.final_freshness.outputs.eligible }}
    steps:
      - name: Checkout exact certified PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.candidate-gate.outputs.certified_sha }}
          fetch-depth: 0

      - name: Verify PR and candidate still point to certified SHA
        id: pr_freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ needs.candidate-gate.outputs.certified_sha }}
          PR_NUMBER: ${{ needs.candidate-gate.outputs.pr_number }}
        run: |
          set -euo pipefail
          pr_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          current_candidate="$(git ls-remote origin refs/heads/candidate | awk '{print $1}')"
          if [ "$pr_head" != "$CERTIFIED_SHA" ] || [ "$current_candidate" != "$CERTIFIED_SHA" ]; then
            echo "::notice::PR/candidate advanced before PR certification. This run is superseded and will be a no-op."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.pr_freshness.outputs.current == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.pr_freshness.outputs.current == 'true'
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Install pinned Playwright Chromium
        if: steps.pr_freshness.outputs.current == 'true'
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Run PR unified error reporter regression
        if: steps.pr_freshness.outputs.current == 'true'
        run: npm run test:reporter

      - name: Run PR GHRAB QA release gate
        if: steps.pr_freshness.outputs.current == 'true'
        run: npm run qa:release
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Verify PR GHRAB Platform P3 conformance
        if: steps.pr_freshness.outputs.current == 'true'
        run: npm run qa:platform

      - name: Enforce PR P5 R2 release gate including GARP 2.5 and N5
        if: steps.pr_freshness.outputs.current == 'true'
        run: npm run qa:p5:ci

      - name: Upload PR certification evidence
        if: always() && steps.pr_freshness.outputs.current == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generator-pr-certification-${{ needs.candidate-gate.outputs.certified_sha }}
          path: qa-results

      - name: Recheck exact PR head after certification
        if: steps.pr_freshness.outputs.current == 'true'
        id: final_freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ needs.candidate-gate.outputs.certified_sha }}
          PR_NUMBER: ${{ needs.candidate-gate.outputs.pr_number }}
        run: |
          set -euo pipefail
          pr_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          current_candidate="$(git ls-remote origin refs/heads/candidate | awk '{print $1}')"
          if [ "$pr_head" != "$CERTIFIED_SHA" ] || [ "$current_candidate" != "$CERTIFIED_SHA" ]; then
            echo "::notice::Candidate advanced during PR certification. Certified SHA will not be merged."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

  promote:
    name: promote-certified-pr
    needs: [candidate-gate, pr-certification]
    if: needs.candidate-gate.outputs.fresh == 'true' && needs.pr-certification.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact certified SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.candidate-gate.outputs.certified_sha }}
          fetch-depth: 0

      - name: Final fail-closed freshness gate
        id: premerge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ needs.candidate-gate.outputs.certified_sha }}
          PR_NUMBER: ${{ needs.candidate-gate.outputs.pr_number }}
        run: |
          set -euo pipefail
          pr_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          current_candidate="$(git ls-remote origin refs/heads/candidate | awk '{print $1}')"
          if [ "$pr_head" != "$CERTIFIED_SHA" ] || [ "$current_candidate" != "$CERTIFIED_SHA" ]; then
            echo "::notice::Certified SHA is no longer the PR/candidate HEAD. Promotion is superseded and will be a no-op."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge certified pull request into main
        if: steps.premerge.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ needs.candidate-gate.outputs.certified_sha }}
          PR_NUMBER: ${{ needs.candidate-gate.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$CERTIFIED_SHA"

      - name: Verify merged source is present on main
        if: steps.premerge.outputs.eligible == 'true'
        id: merged
        shell: bash
        env:
          CERTIFIED_SHA: ${{ needs.candidate-gate.outputs.certified_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_head="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$CERTIFIED_SHA" origin/main; then
            echo "::error::Certified SHA $CERTIFIED_SHA is not contained in main $main_head after merge."
            exit 1
          fi
          echo "main_head=$main_head" >> "$GITHUB_OUTPUT"

      - name: Ensure production deployment runs on merged main
        if: steps.premerge.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_HEAD: ${{ steps.merged.outputs.main_head }}
        run: |
          set -euo pipefail
          find_run() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&per_page=20" --jq ".workflow_runs[] | select(.head_sha == \"$MAIN_HEAD\") | select(.event == \"push\" or .event == \"workflow_dispatch\") | .id" | head -n 1
          }

          deploy_run=""
          for attempt in $(seq 1 6); do
            deploy_run="$(find_run)"
            if [ -n "$deploy_run" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$deploy_run" ]; then
            echo "No automatic main deploy run detected; dispatching deploy.yml explicitly on main."
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
            for attempt in $(seq 1 60); do
              deploy_run="$(find_run)"
              if [ -n "$deploy_run" ]; then
                break
              fi
              sleep 5
            done
          fi

          if [ -z "$deploy_run" ]; then
            echo "::error::Production deployment run did not appear for main SHA $MAIN_HEAD."
            exit 1
          fi

          echo "Waiting for production deployment run $deploy_run on main $MAIN_HEAD."
          gh run watch "$deploy_run" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Synchronise candidate to promoted main when still safe
        if: steps.premerge.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_SHA: ${{ needs.candidate-gate.outputs.certified_sha }}
          MAIN_HEAD: ${{ steps.merged.outputs.main_head }}
        run: |
          set -euo pipefail
          current_candidate="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/candidate" --jq '.object.sha')"
          if [ "$current_candidate" != "$CERTIFIED_SHA" ]; then
            echo "::notice::Candidate advanced to $current_candidate after merge; refusing to overwrite newer candidate work."
            exit 0
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/candidate" -f sha="$MAIN_HEAD" -F force=true >/dev/null
          synced_candidate="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/candidate" --jq '.object.sha')"
          if [ "$synced_candidate" != "$MAIN_HEAD" ]; then
            echo "::error::Candidate synchronisation failed ($synced_candidate != $MAIN_HEAD)."
            exit 1
          fi
          echo "Candidate synchronised to promoted main $MAIN_HEAD."
