name: GIT preproduction native exact-SHA E10 + Journey verification (NO DEPLOY)

# Permanent read-only preproduction test capability. Neither this workflow nor a PASS
# authorizes publication, classroom use, student data migration or Safe Promotion.
# The workflow must live on the *same* commit it tests: GitHub event SHA == git HEAD.
on:
  workflow_dispatch:
  push:
    branches:
      - "preprod/groups-v2-exact-*"

permissions:
  contents: read

concurrency:
  group: generator-groups-v2-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-cross-os:
    name: native source guards (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Checkout actual event source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Native locked Node setup
        uses: ./.github/actions/setup-ci-node
      - name: Fail closed on wrong identity or unapproved release status
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -p 'require("./package.json").version')" = "7.1.102"
          node -e "const s=require('./security/release-readiness-e10.json');if(s.status!=='NOT READY – BLOCKING ISSUE'||s.ownerDecision?.authorizeGithubPublication!==false||s.ownerDecision?.authorizeProductionReleaseAfterMandatoryGates!==false)process.exit(1)"
      - name: Clean locked dependency install
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Stage08, version and E10 release-negative controls
        shell: bash
        run: |
          set -euo pipefail
          npm run check:stage08-groups
          npm run check:stage08-results
          npm run check:versions
          npm run check:redteam-e10
          npm run check:s83-ci-portability

  full-e10-p5:
    name: Full native E10/P5/GARP admission (PREPROD only)
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout actual event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Native locked Node setup
        uses: ./.github/actions/setup-ci-node
      - name: Fail closed on source mismatch and require explicit NO-GO
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -p 'require("./package.json").version')" = "7.1.102"
          node -e "const s=require('./security/release-readiness-e10.json');if(s.status!=='NOT READY – BLOCKING ISSUE'||s.ownerDecision?.authorizeGithubPublication!==false)process.exit(1)"
      - name: Install independent locked P5 tools + Chromium
        id: ci_tools
        uses: ./.github/actions/install-ci-tools
        timeout-minutes: 15
        with:
          expected-sha: ${{ github.sha }}
          browser-env: CHROMIUM_PATH
      - name: Confirm exact reviewed audit-tool versions
        run: |
          node -e "if(require('./node_modules/playwright/package.json').version!=='1.61.1'||require('./node_modules/axe-core/package.json').version!=='4.12.1')process.exit(1)"
      - name: Execute complete original E10 test chain, do not change GITHUB_SHA
        env:
          GARP27_EXTERNAL_TRUST_SHA256: ec7aa8abbc4a4a915627f569eaa69b3a8da56155565b955814263bead2061006
        run: npm run qa:redteam:ci
      - name: Upload diagnostic evidence, no publish
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: git-native-e10-${{ github.sha }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            qa-results/redteam-e*.json
            qa-results/redteam-e10-ci/
            audit/evidence/garp27-current/
            dist/qa-p5-*.json
            dist/quality-report.json

  native-journey-e2e:
    name: Native journey suites with exact event SHA (PREPROD only)
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout actual event source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Native locked Node setup
        uses: ./.github/actions/setup-ci-node
      - name: Require exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Clean independent browser tool installation
        id: ci_tools
        uses: ./.github/actions/install-ci-tools
        timeout-minutes: 15
        with:
          expected-sha: ${{ github.sha }}
          browser-env: CHROMIUM_EXECUTABLE
      - name: Install pinned Python audit requirements
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/pip" install --disable-pip-version-check -r audit/requirements-audit.txt
      - name: Clean stale journey artifacts and build from current source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf audit/evidence
          mkdir -p audit/evidence
          npm run build
      - name: Run independent actual journeys with synthetic fixtures
        shell: bash
        run: |
          "$RUNNER_TEMP/audit-venv/bin/python" audit/run_audit.py \
            --suite journey_suite --suite state_transition_suite --suite config_extra_suite \
            --suite feature_suite --suite integration_suite --suite identity_suite --suite wizard_suite
      - name: Upload journey diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: git-native-journey-${{ github.sha }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: audit/evidence/
