name: Prepare GIT 7.1.101 release metadata (temporary isolated workflow)
on:
  push:
    branches:
      - release/7.1.101-preview-iphone-changelog-20261020

permissions:
  contents: write

concurrency:
  group: prepare-7-1-101-metadata
  cancel-in-progress: false

jobs:
  prepare-release:
    if: "!contains(github.event.head_commit.message, '[release-prepared]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare version, release notes, PWA, trust chain and SBOM
        run: node scripts/prepare-release-7.1.101.mjs
      - name: Remove temporary automation from release before certification
        run: git rm .github/workflows/prepare-7-1-101.yml
      - name: Validate version parity and structural limits before snapshot
        run: |
          npm run check:versions
          npm run check:structure
      - name: Record exact release diff only on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add RELEASE-NOTES-7.1.101.md security/sbom/generator-testu-7.1.101.cdx.json
          echo "Release changed files:"
          git diff --cached --name-only
          if git diff --cached --name-only | grep -E '^src/js/(13|02|03|14)' ; then
            echo "::error::Behavior/runtime change unexpectedly staged"
            exit 1
          fi
          git commit -m "release: GIT 7.1.101 traceable strict preview/iPhone hotfix [release-prepared]"
      - name: Verify committed GARP bytes against Git blobs and CI topology
        run: |
          node scripts/check-s81-byte-checkout-policy.mjs
          node scripts/check-s83-ci-portability.mjs
      - name: Full production bundle build without deployment
        run: npm run build
      - name: Emit reviewed, tested release-only blob transfer records
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const run=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const parent=run('rev-parse','HEAD^');
          const tree=run('show','-s','--format=%T','HEAD');
          const files=run('diff','--name-only','HEAD^','HEAD').split('\n').filter(Boolean);
          const prefix='GHRAB101RECORD';
          console.log(prefix+'|HEADER|'+JSON.stringify({parent,tree,count:files.length}));
          for(const path of files){
            if(!fs.existsSync(path)){
              console.log(prefix+'|DELETE|'+encodeURIComponent(path));
              continue;
            }
            const b64=fs.readFileSync(path).toString('base64');
            const chunkSize=10000;
            const total=Math.ceil(b64.length/chunkSize)||1;
            for(let i=0;i<total;i++)
              console.log(prefix+'|BLOB|'+encodeURIComponent(path)+'|'+i+'|'+total+'|'+b64.slice(i*chunkSize,(i+1)*chunkSize));
          }
          console.log(prefix+'|END|'+files.length);
          NODE
      - name: Publish validated release snapshot to isolated branch
        run: git push origin HEAD:release/7.1.101-preview-iphone-changelog-20261020
