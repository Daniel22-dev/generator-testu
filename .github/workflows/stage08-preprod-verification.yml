name: Stage08 isolated preproduction verification (NO DEPLOY)
on:
  push:
    branches:
      - feature/stage08-groups-direct-r3-20261026
permissions:
  contents: read
concurrency:
  group: stage08-preprod-${{ github.sha }}
  cancel-in-progress: false
jobs:
  p5:
    name: stage08-full-source-P5
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact push SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure locked Node toolchain
        uses: ./.github/actions/setup-ci-node
      - name: Install independently verified CI tools
        uses: ./.github/actions/install-ci-tools
        with:
          expected-sha: ${{ github.sha }}
          browser-env: CHROMIUM_PATH
      - name: Check exact source and updated trust anchor
        shell: bash
        env:
          GARP27_EXTERNAL_TRUST_SHA256: ec7aa8abbc4a4a915627f569eaa69b3a8da56155565b955814263bead2061006
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(sha256sum security/garp27/trust-anchor.json | cut -d' ' -f1)" = "$GARP27_EXTERNAL_TRUST_SHA256"
          node scripts/check-stage08-groups.mjs
          node scripts/check-stage08-results.mjs
      - name: Execute complete GIT E10 and P5 R2 (preproduction only)
        timeout-minutes: 60
        env:
          GARP27_EXTERNAL_TRUST_SHA256: ec7aa8abbc4a4a915627f569eaa69b3a8da56155565b955814263bead2061006
        run: npm run qa:redteam:ci
      - name: Preserve P5 diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage08-preprod-p5-${{ github.sha }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            qa-results/redteam-e10-ci/
            qa-results/qa-report.json
            dist/qa-p5-*.json
  journeys:
    name: stage08-student-teacher-journeys
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact push SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure locked Node toolchain
        uses: ./.github/actions/setup-ci-node
      - name: Install independently verified CI tools
        uses: ./.github/actions/install-ci-tools
        with:
          expected-sha: ${{ github.sha }}
          browser-env: CHROMIUM_EXECUTABLE
      - name: Install pinned Python audit dependencies
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/pip" install --disable-pip-version-check -r audit/requirements-audit.txt
      - name: Build and test workflow journeys
        shell: bash
        env:
          GARP27_EXTERNAL_TRUST_SHA256: ec7aa8abbc4a4a915627f569eaa69b3a8da56155565b955814263bead2061006
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm -rf audit/evidence
          mkdir -p audit/evidence
          npm run build
          "$RUNNER_TEMP/audit-venv/bin/python" audit/run_audit.py --suite journey_suite --suite integration_suite --suite identity_suite --suite state_transition_suite --suite feature_suite
      - name: Preserve journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage08-preprod-journeys-${{ github.sha }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: audit/evidence/
