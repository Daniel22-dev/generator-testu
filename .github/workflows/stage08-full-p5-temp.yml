name: Temporary Stage08 exact-commit supplemental full test (non-deploy)

on:
  push:
    branches: [feature/stage08-groups-direct-r3-20261026]

permissions:
  contents: read

jobs:
  supplemental-full-test:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact Stage08 source without temporary trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 979d512769b1a8a73bab989fba56f117d8926112
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tested source and unmodified release policies
        run: |
          test "$(git rev-parse HEAD)" = "979d512769b1a8a73bab989fba56f117d8926112"
          test ! -e .github/workflows/stage08-full-p5-temp.yml
          git status --porcelain
          node --check scripts/check-csp.mjs
          node --check src/features/group-result-ledger.js
      - name: Configure Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install exact locked test tools (supplemental, not release certification)
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify pinned test dependency versions
        run: |
          node -e "const p=require('./node_modules/playwright/package.json');if(p.version!=='1.61.1')process.exit(1)"
          node -e "const p=require('./node_modules/axe-core/package.json');if(p.version!=='4.12.1')process.exit(1)"
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Execute unmodified full npm regression suite on exact committed source
        run: npm test
        env:
          CHROMIUM_PATH: ${{ runner.os == 'Linux' && '/home/runner/.cache/ms-playwright/chromium-1228/chrome-linux64/chrome' || '' }}
          GARP27_EXTERNAL_TRUST_SHA256: c228a89d1d162e859dc92c9befeb9b4833255848c94a9eca575f793689ff917f
      - name: Preserve supplemental test evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage08-supplemental-full-test-979d512769b1a8a73bab989fba56f117d8926112
          path: |
            qa-results/
            dist/qa-p5-*.json
            dist/quality-report.json
          retention-days: 14
          if-no-files-found: warn
