name: Temporary Stage08 exact-commit P5 validation (non-deploy)

on:
  push:
    branches: [feature/stage08-groups-direct-r3-20261026]

permissions:
  contents: read

jobs:
  exact-commit-p5:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout committed Stage08 code, excluding this temporary trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 979d512769b1a8a73bab989fba56f117d8926112
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact tested revision
        run: |
          test "$(git rev-parse HEAD)" = "979d512769b1a8a73bab989fba56f117d8926112"
          test ! -e .github/workflows/stage08-full-p5-temp.yml
          node -e "const p=require('./package.json');if(p.version!=='7.1.101')process.exit(1)"
      - name: Configure shared CI Node setup
        uses: ./.github/actions/setup-ci-node
      - name: Install independently verified CI tools
        id: ci_tools
        timeout-minutes: 12
        uses: ./.github/actions/install-ci-tools
        with:
          expected-sha: 979d512769b1a8a73bab989fba56f117d8926112
          browser-env: CHROMIUM_PATH
      - name: Verify pinned audit tools
        run: |
          node -e "const p=require('./node_modules/axe-core/package.json');if(p.version!=='4.12.1')process.exit(1)"
          node -e "const p=require('./node_modules/playwright/package.json');if(p.version!=='1.61.1')process.exit(1)"
      - name: Run unchanged GIT red-team / GARP / full P5 admission
        env:
          GARP27_EXTERNAL_TRUST_SHA256: c228a89d1d162e859dc92c9befeb9b4833255848c94a9eca575f793689ff917f
        run: npm run qa:redteam:ci
      - name: Retain audit evidence, no deployment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage08-exact-commit-p5-979d512769b1a8a73bab989fba56f117d8926112
          path: |
            qa-results/
            dist/qa-p5-*.json
            dist/quality-report.json
          retention-days: 14
          if-no-files-found: warn
