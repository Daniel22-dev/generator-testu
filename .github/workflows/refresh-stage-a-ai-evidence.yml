name: Refresh Stage A AI assurance evidence

on:
  push:
    branches: [audit/stage-a-functional-fixes-2026-09-30]

permissions:
  contents: write

concurrency:
  group: generator-stage-a-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Refresh AI assurance fingerprint
        run: node scripts/generate-ai-assurance-fingerprint.mjs security/evidence/ai-assurance-fingerprint.json
      - name: Commit refreshed evidence and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security/evidence/ai-assurance-fingerprint.json
          git rm .github/workflows/refresh-stage-a-ai-evidence.yml
          if git diff --cached --quiet; then
            echo "Nothing to refresh."
            exit 0
          fi
          git commit -m "chore(stage-a): refresh AI assurance fingerprint"
          git push origin HEAD:audit/stage-a-functional-fixes-2026-09-30
