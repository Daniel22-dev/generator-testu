name: Pre-server Forms performance
on:
  push:
    branches: [pre-server-forms-workflow]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pre-server-forms-performance
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Benchmark 100 to 5000 rows
        run: node --expose-gc scripts/benchmark-forms-csv.mjs | tee forms-performance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre-server-forms-performance
          path: forms-performance.json
