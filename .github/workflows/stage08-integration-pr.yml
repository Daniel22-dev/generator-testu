name: Stage 08 isolated integration and P5 evidence

on:
  push:
    branches: [feature/stage08-groups-direct-r3-20261026]
  pull_request:
    branches: [candidate]
    paths:
      - "src/features/central-groups.js"
      - "src/features/central-results.js"
      - "src/features/group-result-ledger.js"
      - "src/js/18-central-groups.js"
      - "src/js/10-testlab.js"
      - "src/js/16-access.js"
      - "src/shell.html"
      - "scripts/check-stage08-groups.mjs"
      - "scripts/check-stage08-results.mjs"
      - "package.json"
      - ".github/workflows/stage08-integration-pr.yml"

permissions:
  contents: read

concurrency:
  group: generator-stage08-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage08-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify Stage08 source syntax
        run: |
          node --check src/js/18-central-groups.js
          node --check src/features/central-groups.js
          node --check src/features/central-results.js
          node --check src/features/group-result-ledger.js
          node --check scripts/check-stage08-groups.mjs
          node --check scripts/check-stage08-results.mjs
      - name: Run Stage08A/Stage08B contracts and privacy regressions
        run: |
          npm run check:stage08-groups
          npm run check:stage08-results
  stage08-full-p5:
    needs: stage08-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure shared CI Node setup
        uses: ./.github/actions/setup-ci-node
      - name: Install independently verified CI tools
        id: ci_tools
        timeout-minutes: 12
        uses: ./.github/actions/install-ci-tools
        with:
          expected-sha: ${{ github.sha }}
          browser-env: CHROMIUM_PATH
      - name: Verify exact browser/a11y tooling
        run: |
          node -e "const p=require('./node_modules/axe-core/package.json');if(p.version!=='4.12.1')process.exit(1)"
          node -e "const p=require('./node_modules/playwright/package.json');if(p.version!=='1.61.1')process.exit(1)"
      - name: Run existing GIT red-team, GARP foundation and complete P5 chain
        env:
          GARP27_EXTERNAL_TRUST_SHA256: c228a89d1d162e859dc92c9befeb9b4833255848c94a9eca575f793689ff917f
        run: npm run qa:redteam:ci
      - name: Preserve P5 and Stage08 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage08-isolated-p5-${{ github.sha }}
          path: |
            qa-results/
            dist/qa-p5-*.json
            dist/quality-report.json
          if-no-files-found: warn
          retention-days: 14
