name: Refresh release evidence
on:
  push:
    branches: [pre-server-forms-workflow]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node scripts/generate-ai-assurance-fingerprint.mjs security/evidence/ai-assurance-fingerprint.json
      - shell: bash
        run: |
          if git diff --quiet -- security/evidence/ai-assurance-fingerprint.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security/evidence/ai-assurance-fingerprint.json
          git commit -m "chore(release): refresh final AI assurance fingerprint"
          git push origin HEAD:pre-server-forms-workflow
