name: Stage09 Material Flow preproduction CI (NO DEPLOY)

on:
  pull_request:
    branches: [candidate]
    paths:
      - 'src/features/stage09-*'
      - 'src/js/17a-stage09-material-outbound.js'
      - 'src/js/17-ai-studio-bridge.js'
      - 'src/shell.html'
      - 'public/sw.js'
      - 'tests/stage09-material.test.mjs'
      - 'package.json'
      - '.github/workflows/stage09-material-preprod-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage09-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  material-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node pinned
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install pinned packages
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Stage08 and E10 checks
        run: |
          npm run check:stage08-groups
          npm run check:stage08-results
          npm run check:redteam-e10
      - name: Test Stage09 pedagogical export and privacy
        run: npm run test:stage09
      - name: Build application and precache
        run: |
          npm run build
          npm run check:precache
