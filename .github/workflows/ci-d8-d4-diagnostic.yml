name: D8 D4 targeted diagnostic

on:
  push:
    branches:
      - ci/d8-diag-20261006

permissions:
  contents: read

jobs:
  d8-d4:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: 7516768223602cec697f4fb173382c2b6d17aab4
      PATCH_FILE: ci-validation/P0_P1_P2_P3_CUMULATIVE.patch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Materialize exact patched source
        shell: bash
        run: |
          set -euo pipefail
          cp "$PATCH_FILE" "${RUNNER_TEMP}/p.patch"
          git reset --hard "$BASE_SHA"
          git clean -fdx
          git apply --check "${RUNNER_TEMP}/p.patch"
          git apply "${RUNNER_TEMP}/p.patch"
      - name: Run complete D8 audit only
        shell: bash
        run: node scripts/check-d8-final-audit.mjs
