name: Stage08 v2 reader independent QA (NO DEPLOY)
on:
  push:
    branches:
      - feature/stage08-v2-reader-20261027

permissions:
  contents: read

jobs:
  stage08-v2-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact draft source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Stage08 canonical contracts and v2 source safety
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check src/features/central-groups.js
          node --check scripts/check-stage08-groups.mjs
          node --check scripts/check-stage08-v2-browser.mjs
          npm run check:stage08-groups
          npm run check:stage08-results
      - name: Install locked test dependencies and Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npx playwright install --with-deps chromium
      - name: Synthetic Chromium v2 import and access denial
        run: node scripts/check-stage08-v2-browser.mjs
