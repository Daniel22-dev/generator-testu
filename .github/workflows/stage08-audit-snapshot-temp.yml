name: Temporary Stage08 tracked-source audit snapshot

on:
  push:
    branches: [feature/stage08-groups-direct-r3-20261026]

permissions:
  contents: read

jobs:
  tracked-source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Archive exactly tracked source files, never workspace secrets
        run: |
          set -eu
          git archive --format=tar HEAD | gzip -9 > stage08-source-snapshot.tar.gz
          sha256sum stage08-source-snapshot.tar.gz
          tar -tzf stage08-source-snapshot.tar.gz | grep -E '^src/(js|features)/' | head -12
      - name: Retain temporary reproducible source snapshot (one day)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage08-source-snapshot-${{ github.sha }}
          path: stage08-source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
