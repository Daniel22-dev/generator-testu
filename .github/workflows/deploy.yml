name: Certifikace a nasazení Generátoru testů

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: generator-testu-pages
  cancel-in-progress: false

jobs:
  qa-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Run unified error reporter regression
        run: npm run test:reporter
      - name: Run GHRAB QA release gate
        run: npm run qa:release
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghrab-qa-generator-${{ github.sha }}
          path: qa-results
      - name: Verify GHRAB Platform P3 conformance
        run: npm run qa:platform

      - name: Enforce P5 R2 release gate
        run: npm run qa:p5:ci

      - name: Verify AI Studio dispatch credential
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          AI_STUDIO_DISPATCH_TOKEN: ${{ secrets.AI_STUDIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$AI_STUDIO_DISPATCH_TOKEN" ]; then
            echo "::error::Missing AI_STUDIO_DISPATCH_TOKEN. Refusing an unnotified production deployment."
            exit 1
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: qa-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  notify-ai-studio:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Notify AI Studio after successful Pages deployment
        shell: bash
        env:
          AI_STUDIO_DISPATCH_TOKEN: ${{ secrets.AI_STUDIO_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          node <<'NODE'
          const payload = {
            event_type: 'app-updated',
            client_payload: {
              app_id: 'generator',
              source_repository: process.env.SOURCE_REPOSITORY,
              source_sha: process.env.SOURCE_SHA,
              deployed_url: process.env.DEPLOYED_URL,
            },
          };
          require('node:fs').writeFileSync('dispatch.json', JSON.stringify(payload));
          NODE
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $AI_STUDIO_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Daniel22-dev/AI-Studio-GHRAB/dispatches \
            --data-binary @dispatch.json
