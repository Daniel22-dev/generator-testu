name: Certifikace a nasazení Generátoru testů

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: generator-testu-pages
  cancel-in-progress: false

jobs:
  qa-build:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release_identity.outputs.version }}
      source_commit: ${{ steps.release_identity.outputs.source_commit }}
      artifact_digest: ${{ steps.release_identity.outputs.artifact_digest }}
      manifest_sha256: ${{ steps.release_identity.outputs.manifest_sha256 }}
      assurance_mode: ${{ steps.release_identity.outputs.assurance_mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Run unified error reporter regression
        run: npm run test:reporter
      - name: Run GHRAB QA release gate
        run: npm run qa:release
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghrab-qa-generator-${{ github.sha }}
          path: qa-results
      - name: Verify GHRAB Platform P3 conformance
        run: npm run qa:platform

      - name: Enforce P5 R2 release gate
        run: npm run qa:p5:ci

      - name: Prepare release identity
        env:
          GHRAB_SOURCE_COMMIT: ${{ github.sha }}
          GHRAB_SOURCE_REPOSITORY: ${{ github.repository }}
          GHRAB_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          GHRAB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GHRAB_BUILDER_ID: github-actions-hosted
          GHRAB_BUILD_ENTRYPOINT: npm run qa:p5:ci
          GHRAB_BUILD_PROFILE: github-pages-release
        run: node scripts/prepare-release-identity.mjs

      - name: Export release identity
        id: release_identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync('dist/release-integrity.json', 'utf8'));
          for (const [key, value] of Object.entries({
            version: release.version,
            source_commit: release.sourceCommit,
            artifact_digest: release.artifactDigest,
            manifest_sha256: release.manifestSha256,
            assurance_mode: release.assuranceMode,
          })) {
            if (!value) throw new Error(`Missing release identity output ${key}`);
            console.log(`${key}=${value}`);
          }
          NODE

      - name: Verify AI Studio dispatch credential
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          AI_STUDIO_DISPATCH_TOKEN: ${{ secrets.AI_STUDIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$AI_STUDIO_DISPATCH_TOKEN" ]; then
            echo "::error::Missing AI_STUDIO_DISPATCH_TOKEN. Refusing an unnotified production deployment."
            exit 1
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: qa-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  notify-ai-studio:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [qa-build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify deployed release identity with bounded retry
        shell: bash
        env:
          DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          EXPECTED_VERSION: ${{ needs.qa-build.outputs.release_version }}
          EXPECTED_SOURCE_SHA: ${{ needs.qa-build.outputs.source_commit }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.qa-build.outputs.artifact_digest }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.qa-build.outputs.manifest_sha256 }}
          EXPECTED_ASSURANCE_MODE: ${{ needs.qa-build.outputs.assurance_mode }}
        run: |
          set -euo pipefail
          base="${DEPLOYED_URL%/}/"
          verified=0
          for attempt in $(seq 1 10); do
            nonce="${EXPECTED_SOURCE_SHA}-${attempt}"
            rm -f live-studio-manifest.json live-release-integrity.json
            if curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "${base}studio-manifest.json?ghrab=${nonce}" -o live-studio-manifest.json \
              && curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "${base}release-integrity.json?ghrab=${nonce}" -o live-release-integrity.json; then
              if node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const hash = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const manifestBytes = fs.readFileSync('live-studio-manifest.json');
          const manifest = JSON.parse(manifestBytes.toString('utf8'));
          const release = JSON.parse(fs.readFileSync('live-release-integrity.json', 'utf8'));
          const expected = {
            repository: process.env.SOURCE_REPOSITORY.toLowerCase(),
            version: process.env.EXPECTED_VERSION,
            sourceSha: process.env.EXPECTED_SOURCE_SHA.toLowerCase(),
            artifactDigest: process.env.EXPECTED_ARTIFACT_DIGEST,
            manifestSha256: process.env.EXPECTED_MANIFEST_SHA256,
            assuranceMode: process.env.EXPECTED_ASSURANCE_MODE,
          };
          const checks = [
            [manifest.id === 'generator', 'manifest appId'],
            [manifest.version === expected.version, 'manifest version'],
            [String(manifest.repository || '').toLowerCase() === expected.repository, 'manifest repository'],
            [manifest.releaseIdentity?.contract === 'ghrab-release-integrity-v2', 'manifest releaseIdentity contract'],
            [manifest.releaseIdentity?.assuranceMode === expected.assuranceMode, 'manifest assurance mode'],
            [release.schema === 'ghrab-release-integrity-v2', 'release schema'],
            [release.appId === 'generator' && release.version === expected.version, 'release app/version'],
            [String(release.sourceRepository || '').toLowerCase() === expected.repository, 'release repository'],
            [String(release.sourceCommit || '').toLowerCase() === expected.sourceSha, 'release source commit'],
            [release.artifactDigest === expected.artifactDigest, 'release artifact digest'],
            [release.manifestSha256 === expected.manifestSha256, 'release manifest digest'],
            [release.assuranceMode === expected.assuranceMode, 'release assurance mode'],
            [hash(manifestBytes) === expected.manifestSha256, 'live manifest bytes'],
          ];
          const failed = checks.filter(([ok]) => !ok).map(([, label]) => label);
          if (failed.length) {
            console.error(`Live release identity not propagated yet: ${failed.join(', ')}`);
            process.exit(1);
          }
          console.log(`Live release identity verified for generator ${expected.version} @ ${expected.sourceSha}`);
          NODE
              then
                verified=1
                break
              fi
            fi
            echo "Live release identity not ready (attempt ${attempt}/10)."
            sleep 6
          done
          if [ "$verified" -ne 1 ]; then
            echo "::error::Live release identity did not converge after bounded retry. Refusing app-updated dispatch."
            exit 1
          fi

      - name: Notify AI Studio after verified Pages deployment
        shell: bash
        env:
          AI_STUDIO_DISPATCH_TOKEN: ${{ secrets.AI_STUDIO_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.qa-build.outputs.source_commit }}
          DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
          RELEASE_VERSION: ${{ needs.qa-build.outputs.release_version }}
          ARTIFACT_DIGEST: ${{ needs.qa-build.outputs.artifact_digest }}
          MANIFEST_SHA256: ${{ needs.qa-build.outputs.manifest_sha256 }}
          ASSURANCE_MODE: ${{ needs.qa-build.outputs.assurance_mode }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const payload = {
            event_type: 'app-updated',
            client_payload: {
              app_id: 'generator',
              source_repository: process.env.SOURCE_REPOSITORY,
              source_sha: process.env.SOURCE_SHA,
              deployed_url: process.env.DEPLOYED_URL,
              version: process.env.RELEASE_VERSION,
              artifact_digest: process.env.ARTIFACT_DIGEST,
              manifest_sha256: process.env.MANIFEST_SHA256,
              assurance_mode: process.env.ASSURANCE_MODE,
              release_identity_contract: 'ghrab-release-integrity-v2',
              run_id: process.env.RUN_ID,
            },
          };
          require('node:fs').writeFileSync('dispatch.json', JSON.stringify(payload));
          NODE
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $AI_STUDIO_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Daniel22-dev/AI-Studio-GHRAB/dispatches \
            --data-binary @dispatch.json
