name: Workflow journeys E2E

# Klikací regresní sady uživatelských cest (audit/run_audit.py).
# D7: Safe Promotion vyžaduje zelený journey-e2e pro stejny certifikovany SHA.
# Evidence adresar se pred kazdym runem cisti, aby artifact neobsahoval stare soubory.

on:
  workflow_dispatch:
  push:
    branches: [pre-server-forms-workflow, candidate, main]

permissions:
  contents: read

concurrency:
  group: generator-journeys-${{ github.sha }}
  cancel-in-progress: true

jobs:
  journey-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure shared CI Node setup
        uses: ./.github/actions/setup-ci-node
      - name: Install independently verified CI tools
        id: ci_tools
        timeout-minutes: 12
        uses: ./.github/actions/install-ci-tools
        with:
          expected-sha: ${{ github.sha }}
          browser-env: CHROMIUM_EXECUTABLE

      - name: Preserve per-job toolchain provenance
        if: always() && (steps.ci_tools.outcome == 'success' || steps.ci_tools.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generator-toolchain-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/generator-ci-tools/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/toolchain.json
          retention-days: 14
          if-no-files-found: error
      - name: Install pinned Python audit tools
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/pip" install --disable-pip-version-check -r audit/requirements-audit.txt
      - name: Clean run-specific audit evidence
        shell: bash
        run: |
          rm -rf audit/evidence
          mkdir -p audit/evidence
      - name: Build
        run: npm run build
      - name: Run workflow journey suites
        shell: bash
        run: |
          "$RUNNER_TEMP/audit-venv/bin/python" audit/run_audit.py \
            --suite journey_suite --suite state_transition_suite --suite config_extra_suite \
            --suite feature_suite --suite integration_suite --suite identity_suite --suite wizard_suite
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journey-e2e-evidence-${{ github.sha }}
          path: audit/evidence/
          retention-days: 14
          if-no-files-found: error
