name: Workflow journeys E2E

# Klikací regresní sady uživatelských cest (audit/run_audit.py). Do 7.1.58 je
# nespouštěl žádný workflow ani npm test, takže regrese v nich nic nestřežily.
# Po prvním zeleném běhu v CI zařaďte job `journey-e2e` mezi povinné kontroly
# (ruleset větve / Safe Promotion), aby selhání blokovalo povýšení do main.

on:
  workflow_dispatch:
  push:
    branches: [candidate, main]

permissions:
  contents: read

concurrency:
  group: generator-journeys-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_EXECUTABLE=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Install pinned Python audit tools
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/pip" install --disable-pip-version-check -r audit/requirements-audit.txt
      - name: Build
        run: npm run build
      - name: Run workflow journey suites
        shell: bash
        run: |
          "$RUNNER_TEMP/audit-venv/bin/python" audit/run_audit.py \
            --suite journey_suite --suite state_transition_suite --suite feature_suite \
            --suite integration_suite --suite identity_suite --suite wizard_suite
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journey-e2e-evidence
          path: audit/evidence/
          retention-days: 14
